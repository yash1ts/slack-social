name: Release CLI

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-cli
  cancel-in-progress: true

jobs:
  release:
    name: Build & release CLI
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Resolve version
        id: meta
        run: |
          VERSION="$(jq -r .version packages/cli/package.json)"
          SHORT_SHA="${GITHUB_SHA::7}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "short_sha=${SHORT_SHA}" >> "$GITHUB_OUTPUT"
          echo "title=CLI v${VERSION} (${SHORT_SHA})" >> "$GITHUB_OUTPUT"

      - name: Cross-compile macOS CLI binaries
        run: |
          set -euo pipefail
          mkdir -p dist/cli

          bun build --compile --minify --target=bun-darwin-arm64 \
            ./packages/cli/src/index.ts \
            --outfile dist/cli/slack-social-darwin-arm64

          bun build --compile --minify --target=bun-darwin-x64 \
            ./packages/cli/src/index.ts \
            --outfile dist/cli/slack-social-darwin-x64

          chmod +x dist/cli/slack-social-darwin-*
          ls -lh dist/cli

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          cat > /tmp/release-notes.md <<EOF
          Automated macOS CLI release from \`master\`.

          - Version: \`${{ steps.meta.outputs.version }}\`
          - Commit: \`${{ steps.meta.outputs.short_sha }}\` (\`${GITHUB_SHA}\`)
          - Built with Bun \`1.3.11\` (\`--compile\`)

          ### Downloads

          | Platform | Asset |
          |----------|-------|
          | macOS Apple Silicon | \`slack-social-darwin-arm64\` |
          | macOS Intel | \`slack-social-darwin-x64\` |

          \`serve\` still expects the \`packages/web\` Next.js app nearby (clone the repo or run via Bun). Auth / sync / debug work from the binary alone.
          EOF

          # Strip common leading indent from the heredoc body.
          sed -i 's/^          //' /tmp/release-notes.md

          # Rolling tag keeps free-tier release storage bounded (~500MB private).
          if gh release view cli-latest >/dev/null 2>&1; then
            gh release delete cli-latest --yes --cleanup-tag
          fi

          gh release create cli-latest \
            dist/cli/* \
            --title "${{ steps.meta.outputs.title }}" \
            --notes-file /tmp/release-notes.md \
            --latest
