name: Bug report
description: Something isn’t working as expected
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve slack-social. Fill in what you can — repro steps help the most.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you expect, and what actually happened?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: Numbered steps if possible
      placeholder: |
        1. npx slack-social serve
        2. …
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: OS, Bun version (`bun --version`), install method (npx / git checkout)
      placeholder: "Linux, Bun 1.3.x, npx slack-social serve"
    validations:
      required: false
  - type: textarea
    id: extras
    attributes:
      label: Extra context
      description: Logs, screenshots, related issues — optional
    validations:
      required: false
